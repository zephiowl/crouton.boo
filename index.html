<html>
<title>Crouton Boo</title>
<body bgcolor="white" text="black">
<link rel="icon" type="image/x-icon" href="croutonboo.ico">
<img src="croutonboo.png" alt="Crouton" style="width: 33px; height: 31px; cursor: pointer;" id="crouton">

<script>
document.getElementById('crouton').addEventListener('click', function() {
    const rand = Math.random();
    if (rand < 1/50) {
        window.location.href = 'https://www.youtube.com/watch?v=H4dGpz6cnHo&list=PLVAh-MgDVqvDUEq6qDXqORBioE4Yhol_z';
        return;
    }
    const sfxFiles = [
        'sfx/Anvil1.mp3.mpeg',
        'sfx/Anvil2.mp3.mpeg',
        'sfx/Burn.mp3.mpeg',
        'sfx/Disgusted.mp3.mpeg',
        'sfx/Dont_touch_me.mp3.mpeg',
        'sfx/Excuse_Me.mp3.mpeg',
        'sfx/Fullofhate.mp3.mpeg',
        'sfx/Idon\'tlikeyou.mp3.mpeg',
        'sfx/I_Dont_Wanna_See_You.mp3.mpeg',
        'sfx/I_HATE_YOU.mp3.mpeg',
        'sfx/Ill.mp3.mpeg',
        'sfx/ImHateFilled.mp3.mpeg',
        'sfx/Jump_Off_Of_A_Microwave.mp3.mpeg',
        'sfx/Knuckle.mp3.mpeg',
        'sfx/Ovenon.mp3.mpeg',
        'sfx/Whats_In_Your_Pocket_What_Did_You_Just_Put_In_Your_Pocket.mp3.mpeg',
        'sfx/Who_Do_You_Think_You_Are.mp3.mpeg',
        'sfx/YOU\'RE_A_LOSER.mp3.mpeg',
        'sfx/Youre_mentally_ill.mp3.mpeg',
        'sfx/You_Would_Tell_Me_If_You_Stole_Something_Right.mp3.mpeg'
    ];
    const randomSfx = sfxFiles[Math.floor(Math.random() * sfxFiles.length)];
    const audio = new Audio(randomSfx);
    audio.play().catch(() => { /* Autoplay blocked, continue anyway */ });
    
    // Create jumpscare overlay - croutonboo.png fills entire screen
    const overlay = document.createElement('div');
    overlay.style = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; display: flex; align-items: center; justify-content: center;';
    overlay.innerHTML = '<img src="croutonboo.png" alt="Jumpscare!" style="max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.3s; animation: shake 0.5s ease-in-out; background-size: contain;">';
    document.body.appendChild(overlay);
    
    // Add shake animation
    const style = document.createElement('style');
    style.innerHTML = '@keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } 100% { transform: rotate(-15deg); } }';
    document.head.appendChild(style);
    
    // Remove overlay after 3 seconds
    setTimeout(() => {
        overlay.remove();
    }, 3000);
});
</script>
</body>
</html>
